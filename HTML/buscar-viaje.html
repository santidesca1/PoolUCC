<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoolUCC - Buscar viaje</title>
  <meta name="description" content="Pantalla de búsqueda de viajes disponibles en PoolUCC">
  <meta name="author" content="Nacho">
</head>
<body>

  <!-- Feature: Búsqueda de viajes por destino / Mapa-ubicación -->
  <header>
    <img src="logo-poolucc.png" alt="Logo de PoolUCC">
    <h1>&iexcl;Hola! &iquest;A d&oacute;nde vamos hoy?</h1>
  </header>

  <main>
    <form id="form-buscar-viaje" action="#" method="get">
      <label for="destino">&iquest;A d&oacute;nde vas?</label>
      <input type="text" id="destino" name="destino" list="destinos" placeholder="Elegir destino">

      <datalist id="destinos">
        <option value="Campus">Campus</option>
        <option value="Trejo">Trejo</option>
        <option value="Cs. Salud">Cs. Salud</option>
      </datalist>

      <button type="submit">Buscar</button>
    </form>

    <div id="mapa-ubicacion">
      <p>Mapa - Ubicaci&oacute;n actual</p>
    </div>
  </main>

  <footer>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Mis viajes</a>
      <a href="#">Perfil</a>
    </nav>
  </footer>

</body>
</html>
