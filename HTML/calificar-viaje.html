<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoolUCC - Calificar viaje</title>
  <meta name="description" content="Calificación del viaje y contacto post-viaje en PoolUCC">
  <meta name="author" content="Nacho">
</head>
<body>

  <!-- Feature: Calificación del viaje / Comentarios / Contacto post-viaje -->
  <header>
    <button type="button">&larr;</button>
    <h1>Calificar viaje</h1>
  </header>

  <main>
    <p>
      <label for="calificacion">Calificaci&oacute;n del viaje</label><br>
      <meter id="calificacion" name="calificacion" min="0" max="5" value="0">0 de 5 estrellas</meter>
    </p>

    <p>&iquest;Te olvidaste algo?</p>
    <p>
      <img src="whatsapp-icon.png" alt="WhatsApp">
      <a href="https://wa.me/5490000000000" target="_blank">Datos conductor</a>
    </p>

    <p>
      <label for="comentarios">Comentarios</label><br>
      <textarea id="comentarios" name="comentarios" rows="5" cols="50"></textarea>
    </p>

    <p>
      <button type="button">Volver &larr;</button>
    </p>
  </main>

</body>
</html>
