<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoolUCC - Confirmar viaje</title>
  <meta name="description" content="Confirmación y reserva de un viaje seleccionado en PoolUCC">
  <meta name="author" content="Nacho">
</head>
<body>

  <!-- Feature: Detalle de viaje / Contacto con el conductor / Reserva de viaje -->
  <header>
    <button type="button">&larr;</button>
    <h1>Confirmar viaje</h1>
  </header>

  <main>
    <div id="mapa-recorrido">
      <p>Mapa: punto de encuentro &rarr; destino</p>
    </div>

    <p>
      <img src="whatsapp-icon.png" alt="WhatsApp">
      <a href="https://wa.me/5490000000000" target="_blank">Datos conductor</a>
    </p>

    <section>
      <h2>Detalles del viaje</h2>
      <ul>
        <li>Asientos</li>
        <li>Punto de encuentro</li>
        <li>Horario/fecha</li>
      </ul>
    </section>

    <p>Precio</p>

    <p>
      <button type="button">Reservar viaje</button>
    </p>
  </main>

</body>
</html>
