<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoolUCC - Mis viajes</title>
  <meta name="description" content="Listado de viajes publicados por el conductor en PoolUCC, con sus estados y estadísticas">
  <meta name="author" content="Nacho">
</head>
<body>

  <!-- Feature: Gestión de "Mis viajes" con estados / Estadísticas del conductor -->
  <header>
    <h1>Mis viajes</h1>
  </header>

  <main>

    <article>
      <h2>Viaje 1 - <em>Confirmado</em></h2>
      <p>Detalles del viaje</p>
      <button type="button">Info pasajeros</button>
      <button type="button">Cancelar?</button>
    </article>

    <article>
      <h2>Viaje 2 - <em>Por confirmar</em></h2>
      <p>Detalles del viaje</p>
      <button type="button">Solicitudes</button>
      <button type="button">Cancelar?</button>
    </article>

    <article>
      <h2>Viaje 2 - <em>Realizado</em></h2>
      <p>Detalles del viaje</p>
      <button type="button">Info pasajeros</button>
    </article>

    <table>
      <caption>Resumen de viajes</caption>
      <thead>
        <tr>
          <th>Viajes totales</th>
          <th>Total generado</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>2</td>
          <td>$$$$</td>
        </tr>
      </tbody>
    </table>

  </main>

  <footer>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Mis viajes</a>
      <a href="#">Perfil</a>
    </nav>
  </footer>

</body>
</html>
