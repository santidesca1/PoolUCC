<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoolUCC - Seleccionar viaje</title>
  <meta name="description" content="Listado de viajes disponibles para el destino buscado en PoolUCC">
  <meta name="author" content="Nacho">
</head>
<body>

  <!-- Feature: Listado de resultados de búsqueda -->
  <header>
    <img src="logo-poolucc.png" alt="Logo de PoolUCC">
    <h1>Viajes disponibles</h1>
  </header>

  <main>
    <p>
      <label for="cantidad-resultados">Cantidad de coincidencias</label>
      <input type="number" id="cantidad-resultados" name="cantidad-resultados" value="3" min="0">
    </p>

    <article>
      <h2>Viaje 1</h2>
      <p>Info viaje 1</p>
    </article>

    <article>
      <h2>Viaje 2</h2>
      <p>Info viaje 2</p>
    </article>

    <article>
      <h2>Viaje 3</h2>
      <p>Info viaje 3</p>
    </article>
  </main>

  <footer>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Mis viajes</a>
      <a href="#">Perfil</a>
    </nav>
  </footer>

</body>
</html>
