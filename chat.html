<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chat con el conductor del viaje.">
  <meta name="author" content="Nacho Albizuri">
  <meta name="keywords" content="carpooling, viajes compartidos, universidad, UCC, campus">
  <title>Chat con Marta Ruiz - PoolUCC</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="JS/datos.js" defer></script>
  <script src="JS/comun.js" defer></script>
  <script src="JS/chat.js" defer></script>
</head>
<body>

  <main class="estrecho">
    <header class="barra">
      <a class="volver" id="volver" href="reservado.html">← Volver al viaje</a>
      <div>
        <h1 id="conductor">Marta Ruiz</h1>
        <p id="ruta">Nueva Córdoba → Campus UCC · 8:15</p>
      </div>
      <span class="avatar" id="iniciales">MR</span>
    </header>

    <section class="contenido">
      <!-- chat.js dibuja acá los mensajes guardados -->
      <div class="chat" id="chat">
        <span class="etiqueta etiqueta-gris chat-dia">Hoy</span>
      </div>

      <form class="fila" action="chat.html" method="get" onsubmit="return enviarMensaje()">
        <div class="campo">
          <label class="oculto" for="mensaje">Mensaje</label>
          <input type="text" id="mensaje" name="mensaje" placeholder="Escribí un mensaje" maxlength="300" required>
        </div>
        <button class="boton boton-chico" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <nav class="menu">
    <p class="logo menu-logo">Pool<span>UCC</span></p>
    <a class="activo" href="index.html">Buscar</a>
    <a href="mis-viajes.html">Ofrecer</a>
    <a href="perfil.html">Perfil</a>
  </nav>

  <footer>
    <p>PoolUCC · Taller de Desarrollo Web — UCC · Nacho Albizuri · 2026</p>
  </footer>

</body>
</html>
