<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PoolUCC - Compartí tu viaje universitario. Buscá y ofrecé viajes compartidos en tu campus.">
  <meta name="author" content="Nacho Albizuri, Santiago Descalzo">
  <meta name="keywords" content="carpooling, viajes compartidos, universidad, UCC, campus">
  <title>Buscar viaje - PoolUCC</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="JS/datos.js" defer></script>
  <script src="JS/comun.js" defer></script>
  <script src="JS/index.js" defer></script>
</head>
<body>

  <main>
    <header class="hero">
      <div class="hero-fila">
        <p class="logo">Pool<span>UCC</span></p>
        <a class="avatar" id="avatar" href="perfil.html" title="Ir a mi perfil">NA</a>
      </div>
      <p class="hero-fecha" id="fecha">Martes, 24 de octubre</p>
      <h1 id="saludo">Hola, Nacho</h1>
    </header>

    <!-- En el celular las tres partes van una abajo de la otra (buscar, mapa, tarjetas).
         En escritorio, grid-template-areas las acomoda: buscar a la izquierda y
         tarjetas + mapa a la derecha (ver .inicio-grilla en styles.css). -->
    <section class="contenido inicio-grilla">

      <div class="columna area-buscar">
        <!-- buscar() valida y guarda la búsqueda; si está todo bien, va a resultados.html -->
        <form class="tarjeta" action="resultados.html" method="get" onsubmit="return buscar()">
          <div class="campo">
            <label for="desde">Desde</label>
            <div class="campo-con-boton">
              <input type="text" id="desde" name="desde" list="salidas" placeholder="Tu barrio o una sede" required>
              <button class="boton boton-borde boton-chico" type="button" onclick="usarMiUbicacion()" title="Usar mi ubicación actual">Mi ubicación</button>
            </div>
            <small class="ayuda" id="estadoUbicacion"></small>
          </div>

          <!-- La llegada siempre es una sede de la UCC -->
          <div class="campo">
            <label for="hasta">Hasta (sede)</label>
            <select id="hasta" name="hasta">
              <option value="Campus UCC">Campus UCC</option>
              <option value="Sede Centro (Obispo Trejo)">Sede Centro (Obispo Trejo)</option>
              <option value="Ciencias de la Salud">Ciencias de la Salud</option>
            </select>
          </div>

          <div class="fila">
            <div class="campo">
              <label for="hora">Salida</label>
              <input type="time" id="hora" name="hora" value="08:00">
            </div>
            <div class="campo">
              <label for="plazas">Plazas</label>
              <select id="plazas" name="plazas">
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div>
          </div>

          <fieldset>
            <legend>Filtrar viajes</legend>
            <div class="opciones">
              <label><input type="radio" name="filtro" value="Hoy" checked> Hoy</label>
              <label><input type="radio" name="filtro" value="Mañana"> Mañana</label>
              <label><input type="radio" name="filtro" value="Mi grado"> Mi grado</label>
              <label><input type="radio" name="filtro" value="Recurrentes"> Recurrentes</label>
            </div>
          </fieldset>

          <p class="mensaje-error" id="error"></p>

          <button class="boton" type="submit">Buscar</button>
        </form>

        <!-- Salidas sugeridas para el campo "Desde" (atributo list): sedes y barrios -->
        <datalist id="salidas">
          <option value="Campus UCC">
          <option value="Sede Centro (Obispo Trejo)">
          <option value="Ciencias de la Salud">
          <option value="Nueva Córdoba">
          <option value="Güemes">
          <option value="Barrio Jardín">
          <option value="General Paz">
          <option value="Alta Córdoba">
          <option value="Villa Cabrera">
          <option value="Cerro de las Rosas">
        </datalist>
      </div>

      <!-- Si el usuario comparte su ubicación, JavaScript centra el mapa en él -->
      <iframe class="mapa mapa-iframe area-mapa" id="mapa" src="https://www.openstreetmap.org/export/embed.html?bbox=-64.2100%2C-31.4450%2C-64.1650%2C-31.3950&layer=mapnik" title="Mapa de tu ubicación" loading="lazy"></iframe>

      <div class="columna area-lateral">
        <!-- Si el usuario tiene una reserva, index.js la muestra acá -->
        <div id="proximo"></div>

        <a class="tarjeta tarjeta-enlace tarjeta-acento" href="publicar.html">
          <h2>¿Manejás vos?</h2>
          <p class="texto-suave">Publicá tu ruta en un minuto</p>
        </a>
      </div>

    </section>
  </main>

  <nav class="menu">
    <p class="logo menu-logo">Pool<span>UCC</span></p>
    <a class="activo" href="index.html">Buscar</a>
    <a href="mis-viajes.html">Ofrecer</a>
    <a class="menu-perfil" href="perfil.html">Perfil</a>
    <a class="menu-usuario" href="perfil.html" title="Mi perfil"><span class="avatar avatar-chico" id="menuIniciales"></span> <span id="menuNombre">Mi perfil</span></a>
  </nav>

  <footer>
    <p>PoolUCC · Taller de Desarrollo Web — UCC · Nacho Albizuri y Santiago Descalzo · 2026</p>
  </footer>

</body>
</html>
