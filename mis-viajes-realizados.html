<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tus viajes realizados como conductor.">
  <meta name="author" content="Nacho Albizuri">
  <meta name="keywords" content="carpooling, viajes compartidos, universidad, UCC, campus">
  <title>Viajes realizados - PoolUCC</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="estrecho">
    <header class="barra">
      <div>
        <h1>Mis viajes</h1>
      </div>
      <a class="boton boton-borde boton-chico" href="publicar.html">+ Publicar viaje</a>
    </header>

    <section class="contenido">
      <div class="pestanas">
        <a href="mis-viajes.html">Próximos (2)</a>
        <a class="activa" href="mis-viajes-realizados.html">Realizados (1)</a>
      </div>

      <article class="tarjeta">
        <div class="viaje-cabecera">
          <p class="viaje-conductor"><strong>Viernes pasado</strong></p>
          <span class="etiqueta etiqueta-gris">Realizado</span>
        </div>
        <ul class="recorrido">
          <li><span>Campus Norte</span></li>
          <li><span>Estación Sur</span></li>
        </ul>
        <div class="viaje-cabecera">
          <p class="viaje-conductor plazas">1 plaza libre</p>
          <p class="texto-suave">2 pasajeros</p>
        </div>
      </article>

      <!-- Estadísticas: el dorado (acento) se usa solo para lo que se ahorró o ganó -->
      <div class="tarjeta tarjeta-oscura estadisticas">
        <div>
          <p>Viajes totales</p>
          <p class="cifra cifra-blanca">1</p>
        </div>
        <div>
          <p>Total generado</p>
          <p class="cifra cifra-acento">$4.000</p>
        </div>
      </div>
    </section>
  </main>

  <nav class="menu">
    <a href="index.html">Buscar</a>
    <a class="activo" href="mis-viajes.html">Ofrezco</a>
    <a href="perfil.html">Perfil</a>
  </nav>

  <footer>
    <p>PoolUCC · Taller de Desarrollo Web — UCC · Nacho Albizuri · 2026</p>
  </footer>

</body>
</html>
