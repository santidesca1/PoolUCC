<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Viajes compartidos disponibles para tu búsqueda.">
  <meta name="author" content="Nacho Albizuri">
  <meta name="keywords" content="carpooling, viajes compartidos, universidad, UCC, campus">
  <title>Viajes disponibles - PoolUCC</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="JS/datos.js" defer></script>
  <script src="JS/comun.js" defer></script>
  <script src="JS/resultados.js" defer></script>
</head>
<body>

  <main>
    <header class="barra">
      <a class="volver" href="index.html">← Volver a buscar</a>
      <div>
        <h1>Viajes disponibles</h1>
        <p id="resumen">Todos los viajes</p>
      </div>
    </header>

    <section class="contenido dos-columnas">

      <div class="columna">
        <!-- Cada cambio en los filtros vuelve a dibujar la lista (mostrarViajes) -->
        <form class="tarjeta" onsubmit="return false">
          <div class="campo">
            <label for="filtroSede">Sede de llegada</label>
            <select id="filtroSede" onchange="mostrarViajes()">
              <option value="Todas">Todas las sedes</option>
              <option value="Campus UCC">Campus UCC</option>
              <option value="Sede Centro (Obispo Trejo)">Sede Centro (Obispo Trejo)</option>
              <option value="Ciencias de la Salud">Ciencias de la Salud</option>
            </select>
          </div>

          <div class="fila">
            <div class="campo">
              <label for="precioMaximo">Precio máximo</label>
              <input type="number" id="precioMaximo" min="0" step="500" placeholder="Sin límite" oninput="mostrarViajes()">
            </div>
            <div class="campo">
              <label for="tipo">Mostrar</label>
              <select id="tipo" onchange="mostrarViajes()">
                <option value="Todos">Todos</option>
                <option value="Hoy">Hoy</option>
                <option value="Mañana">Mañana</option>
                <option value="Mi grado">Mi grado</option>
                <option value="Recurrentes">Recurrentes</option>
              </select>
            </div>
          </div>

          <div class="campo">
            <label for="orden">Ordenar por</label>
            <select id="orden" onchange="mostrarViajes()">
              <option value="cercania" id="opcionCercania">Más cerca de mí</option>
              <option value="horario">Horario de salida</option>
              <option value="precioMenor">Precio: de menor a mayor</option>
              <option value="precioMayor">Precio: de mayor a menor</option>
              <option value="puntaje">Mejor puntaje</option>
            </select>
          </div>

          <div class="opciones">
            <label><input type="checkbox" id="soloConLugares" onchange="mostrarViajes()"> <span id="textoLugares">Solo con lugares</span></label>
          </div>
        </form>

        <h2 id="contador">Viajes</h2>
        <div class="columna" id="lista"></div>
      </div>

      <div class="mapa mapa-solo-escritorio">Mapa · un punto por cada viaje</div>

    </section>
  </main>

  <nav class="menu">
    <p class="logo menu-logo">Pool<span>UCC</span></p>
    <a class="activo" href="index.html">Buscar</a>
    <a href="mis-viajes.html">Ofrecer</a>
    <a href="perfil.html">Perfil</a>
  </nav>

  <footer>
    <p>PoolUCC · Taller de Desarrollo Web — UCC · Nacho Albizuri · 2026</p>
  </footer>

</body>
</html>
