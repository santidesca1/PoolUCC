<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Solicitudes de compañeros para tu viaje.">
  <meta name="author" content="Nacho Albizuri, Santiago Descalzo">
  <meta name="keywords" content="carpooling, viajes compartidos, universidad, UCC, campus">
  <title>Solicitudes - PoolUCC</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="JS/datos.js" defer></script>
  <script src="JS/comun.js" defer></script>
  <script src="JS/solicitudes.js" defer></script>
</head>
<body>

  <main class="estrecho">
    <header class="barra">
      <a class="volver" href="mis-viajes.html">← Volver a mis viajes</a>
      <div>
        <h1>Solicitudes</h1>
        <p id="ruta">Nueva Córdoba → Campus UCC</p>
      </div>
    </header>

    <!-- "required" en cada grupo de radios: no se puede confirmar sin responder todas.
         Cada cambio recalcula los lugares (onchange) y al confirmar se guardan. -->
    <form class="contenido" action="mis-viajes.html" method="get" onchange="actualizarLugares()" onsubmit="return confirmarSolicitudes()">


      <div id="listaSolicitudes"></div>
      <p class="tarjeta tarjeta-fila">
        <span class="texto-suave">Lugares disponibles</span>
        <strong id="lugares">3</strong>
      </p>

      <p class="mensaje-error" id="error"></p>

      <button class="boton boton-oscuro" type="submit">Confirmar viaje</button>
      <p class="texto-suave texto-centrado">Respondé todas las solicitudes para confirmar</p>
    </form>
  </main>

  <!-- Ventana de avisos y confirmaciones (la manejan avisar() y confirmar() de comun.js) -->
  <dialog class="dialogo" id="dialogo" onclose="alCerrarDialogo()">
    <h2 id="dialogoTitulo">Aviso</h2>
    <p class="texto-suave" id="dialogoTexto"></p>
    <div class="dialogo-botones">
      <button class="boton boton-borde boton-chico" id="dialogoCancelar" type="button" onclick="cerrarDialogo(false)">Cancelar</button>
      <button class="boton boton-chico" id="dialogoAceptar" type="button" onclick="cerrarDialogo(true)">Aceptar</button>
    </div>
  </dialog>

  <nav class="menu">
    <p class="logo menu-logo">Pool<span>UCC</span></p>
    <a href="index.html">Buscar</a>
    <a class="activo" href="mis-viajes.html">Ofrecer</a>
    <a class="menu-perfil" href="perfil.html">Perfil</a>
    <a class="menu-usuario" href="perfil.html" title="Mi perfil"><span class="avatar avatar-chico" id="menuIniciales"></span> <span id="menuNombre">Mi perfil</span></a>
  </nav>

  <footer>
    <p>PoolUCC · Taller de Desarrollo Web — UCC · Nacho Albizuri y Santiago Descalzo · 2026</p>
  </footer>

</body>
</html>
